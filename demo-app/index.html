
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusCRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --accent: #6366f1;
      --accent2: #818cf8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
      --text: #e2e8f0;
      --muted: #64748b;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent2), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
    }
    .nav-tab {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
    }
    .nav-tab.active, .nav-tab:hover { background: var(--surface2); color: var(--text); }
    .nav-tab.active { color: var(--accent2); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      width: 220px;
      transition: border-color 0.15s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.85rem;
      width: 100%;
    }
    .search-box input::placeholder { color: var(--muted); }
    .avatar-sm {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    /* ── LAYOUT ── */
    .main { display: flex; flex: 1; }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }
    .sidebar-section { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 12px 8px 6px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      font-size: 0.85rem; cursor: pointer; color: var(--muted);
      transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
    }
    .sidebar-item:hover { background: var(--surface2); color: var(--text); }
    .sidebar-item.active { background: rgba(99,102,241,0.15); color: var(--accent2); }
    .sidebar-item .icon { width: 18px; text-align: center; }
    .badge {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
    }

    /* ── CONTENT ── */
    .content { flex: 1; padding: 28px; overflow-y: auto; }

    /* ── STATS ROW ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .stat-card.c1::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .stat-card.c2::before { background: linear-gradient(90deg, var(--green), #34d399); }
    .stat-card.c3::before { background: linear-gradient(90deg, var(--yellow), #fcd34d); }
    .stat-card.c4::before { background: linear-gradient(90deg, var(--blue), #60a5fa); }
    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .stat-change { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 0.75rem; }
    .stat-change.up { color: var(--green); }
    .stat-change.down { color: var(--red); }
    .stat-icon {
      position: absolute; right: 18px; top: 18px;
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; opacity: 0.9;
    }
    .s1 .stat-icon { background: rgba(99,102,241,0.15); }
    .s2 .stat-icon { background: rgba(16,185,129,0.15); }
    .s3 .stat-icon { background: rgba(245,158,11,0.15); }
    .s4 .stat-icon { background: rgba(59,130,246,0.15); }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .toolbar-title { font-size: 1.1rem; font-weight: 600; }
    .toolbar-count { font-size: 0.8rem; color: var(--muted); padding: 3px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
    .filter-tabs { display: flex; gap: 4px; }
    .filter-tab {
      padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); transition: all 0.15s;
    }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
    .btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4f52d4; }

    /* ── CUSTOMER GRID ── */
    .customer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .customer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .customer-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(99,102,241,0.15);
    }
    .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; flex-shrink: 0;
      letter-spacing: -0.5px;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-role { font-size: 0.75rem; color: var(--muted); }
    .card-company { font-size: 0.8rem; color: var(--accent2); margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0;
    }
    .status-active { background: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
    .status-prospect { background: var(--yellow); box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
    .status-inactive { background: var(--muted); }
    .status-churned { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }

    .card-metrics {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    .metric { background: var(--surface2); border-radius: 8px; padding: 10px; }
    .metric-label { font-size: 0.65rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .metric-value { font-size: 0.9rem; font-weight: 700; }
    .metric-value.green { color: var(--green); }
    .metric-value.yellow { color: var(--yellow); }
    .metric-value.blue { color: var(--blue); }

    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 500;
    }
    .tag-enterprise { background: rgba(99,102,241,0.15); color: var(--accent2); border: 1px solid rgba(99,102,241,0.3); }
    .tag-saas { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .tag-fintech { background: rgba(245,158,11,0.12); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .tag-healthcare { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .tag-ecommerce { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .tag-smb { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .tag-logistics { background: rgba(20,184,166,0.12); color: #2dd4bf; border: 1px solid rgba(20,184,166,0.3); }

    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .last-contact { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .card-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem; transition: all 0.15s; color: var(--muted);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent2); }

    /* Sparkline */
    .sparkline { margin-bottom: 14px; }
    .sparkline-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .spark-bar-row { display: flex; align-items: flex-end; gap: 3px; height: 36px; }
    .spark-bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 6px; transition: height 0.3s; }

    /* Health score bar */
    .health-bar { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .health-fill { height: 100%; border-radius: 4px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 560px;
      max-width: 95vw;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header {
      padding: 24px 24px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .modal-body { padding: 20px 24px 24px; }
    .modal-close {
      background: var(--surface2); border: none; color: var(--muted);
      width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--text); }
    .detail-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .detail-block { flex: 1; background: var(--surface2); border-radius: 8px; padding: 12px; }
    .detail-block-label { font-size: 0.7rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .detail-block-value { font-size: 0.9rem; font-weight: 600; }
    .timeline { margin-top: 16px; }
    .timeline-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
    .timeline-text { font-size: 0.82rem; }
    .timeline-date { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* Empty / hidden */
    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    /* Responsive */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .sidebar { display: none; }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .nav-tabs { display: none; }
      .content { padding: 16px; }
    }
  </style>
</head>

let currentFilter = 'all';
let currentSearch = '';
let currentTag = '';

function healthColor(h) {
  if (h >= 80) return '#10b981';
  if (h >= 55) return '#f59e0b';
  return '#ef4444';
}

function sparkBar(data, color) {
  const max = Math.max(...data);
  return data.map(v => {
    const h = Math.round((v / max) * 36);
    return `<div class="spark-bar" style="height:${h}px;background:${color};opacity:0.7"></div>`;
  }).join('');
}

function renderCards(list) {
  const grid = document.getElementById('customerGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countBadge').textContent = `${list.length} total`;
  document.getElementById('sideCount').textContent = list.length;

  if (!list.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = list.map(c => {
    const sc = `status-${c.status}`;
    const hColor = healthColor(c.health);
    const tagHtml = c.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
    const barColor = c.health >= 80 ? '#6366f1' : c.health >= 55 ? '#f59e0b' : '#ef4444';

    return `
    <div class="customer-card" onclick="openModal(${c.id})">
      <div class="card-header">
        <div class="avatar" style="background:${c.color}">${c.initials}</div>
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="card-role">${c.role}</div>
          <div class="card-company">${c.company}</div>
        </div>
        <div class="status-dot ${sc}"></div>
      </div>

      <div class="card-metrics">
        <div class="metric">
          <div class="metric-label">Revenue</div>
          <div class="metric-value green">${c.revenue}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Deals</div>
          <div class="metric-value blue">${c.deals}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Health</div>
          <div class="metric-value" style="color:${hColor}">${c.health}</div>
          <div class="health-bar"><div class="health-fill" style="width:${c.health}%;background:${hColor}"></div></div>
        </div>
      </div>

      <div class="sparkline">
        <div class="sparkline-label"><span>Activity (10 weeks)</span><span style="color:${barColor}">${c.health}%</span></div>
        <div class="spark-bar-row">${sparkBar(c.sparkData, barColor)}</div>
      </div>

      <div class="card-tags">${tagHtml}</div>

      <div class="card-footer">
        <span class="last-contact">🕐 ${c.lastContact}</span>
        <div class="card-actions">
          <button class="icon-btn" title="Email" onclick="event.stopPropagation()">✉️</button>
          <button class="icon-btn" title="Call" onclick="event.stopPropagation()">📞</button>
          <button class="icon-btn" title="More" onclick="event.stopPropagation()">⋯</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function getFiltered() {
  return customers.filter(c => {
    const matchStatus = currentFilter === 'all' || c.status === currentFilter;
    const matchTag = !currentTag || c.tags.includes(currentTag);
    const q = currentSearch.toLowerCase();
    const matchSearch = !q || c.name.toLowerCase().includes(q) || c.company.toLowerCase().includes(q) || c.role.toLowerCase().includes(q);
    return matchStatus && matchTag && matchSearch;
  });
}

function setStatusFilter(status, el) {
  currentFilter = status;
  currentTag = '';
  // update toolbar tabs
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  // update sidebar
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderCards(getFiltered());
}

function setFilter(tag, el) {
  currentTag = tag;
  currentFilter = 'all';
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderCards(getFiltered());
}

function filterCards() {
  currentSearch = document.getElementById('globalSearch').value;
  renderCards(getFiltered());
}

function openModal(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;

  const hColor = healthColor(c.health);
  const tagHtml = c.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join('');

  document.getElementById('modalTitle').innerHTML = `
    <div class="avatar" style="background:${c.color};width:52px;height:52px;border-radius:14px;font-size:1.1rem">${c.initials}</div>
    <div>
      <div style="font-size:1.1rem;font-weight:700">${c.name}</div>
      <div style="font-size:0.8rem;color:var(--muted)">${c.role} · ${c.company}</div>
      <div style="margin-top:4px">${tagHtml}</div>
    </div>`;

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-row">
      <div class="detail-block">
        <div class="detail-block-label">📧 Email</div>
        <div class="detail-block-value" style="font-size:0.8rem">${c.email}</div>
      </div>
      <div class="detail-block">
        <div class="detail-block-label">📞 Phone</div>
        <div class="detail-block-value" style="font-size:0.8rem">${c.phone}</div>
      </div>
    </div>
    <div class="detail-row">
      <div class="detail-block">
        <div class="detail-block-label">📍 Location</div>
        <div class="detail-block-value">${c.location}</div>
      </div>
      <div class="detail-block">
        <div class="detail-block-label">💰 Revenue</div>
        <div class="detail-block-value" style="color:var(--green)">${c.revenue}</div>
      </div>
      <div class="detail-block">
        <div class="detail-block-label">❤️ Health</div>
        <div class="detail-block-value" style="color:${hColor}">${c.health}/100</div>
      </div>
    </div>
    <div style="background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:14px">
      <div class="detail-block-label">📝 Notes</div>
      <div style="font-size:0.85rem;line-height:1.6;margin-top:6px">${c.notes}</div>
    </div>
    <div>
      <div class="detail-block-label" style="padding:0 0 8px">🕐 Recent Activity</div>
      <div class="timeline">
        ${c.timeline.map(t => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div><div class="timeline-text">${t.text}</div><div class="timeline-date">${t.date}</div></div>
          </div>`).join('')}
      </div>
    </div>`;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// Init
renderCards(customers);
</script>
